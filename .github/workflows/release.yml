name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # DSH desktop runs on Windows, and the context-index tests assert Windows path
    # normalization, so the release runs on the same platform the plugin targets.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        shell: cmd
        run: npm.cmd install -g "npm@^11"

      - name: Validate package
        shell: cmd
        run: |
          node --check index.js
          node --test
          npm.cmd pack --dry-run

      - name: Publish to npm
        shell: cmd
        run: npm.cmd publish --access public --provenance

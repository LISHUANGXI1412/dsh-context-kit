# dsh-context-kit: 压缩阈值调优器（agent preset 内部配置），只插入、不冻结上游。
# 上下文索引已迁到 dsh-token-trim（0.3.0 起）。
- insert:
    # 包名入口：只为让 dsh.client 客户端面板挂到组合树上（host.js 是空实现）。
    - id: context-kit
      name: dsh-context-kit
    - id: context-kit-tuner
      name: dsh-context-kit/tuner
      config:
        autoSync: true
        presets: {}
